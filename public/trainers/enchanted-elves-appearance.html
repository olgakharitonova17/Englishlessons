or:#71a878;background:#edf7ea;color:#286a37}.choice.wrong{border-color:#dfa0a1;background:#fff0ef;color:#a64e50;animation:nudge .3s}.choice:disabled{cursor:default}.feedback{min-height:39px;margin:14px 0 0;text-align:center;font-weight:800;font-size:19px;color:#3d7848}.feedback.retry{color:#ad5a59}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:5px}.secondary,.next{min-height:47px;border-radius:15px;font:800 16px var(--ui);cursor:pointer}.secondary{border:1px solid #d9dfcf;background:#fffdf8;color:#52685a;padding:0 15px}.next{border:0;background:var(--deep);color:#fff;padding:0 24px;box-shadow:0 7px 17px rgba(31,70,48,.16)}.next:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.finish{text-align:center;padding:34px 10px}.finish-icon{font-size:67px}.finish h2{font-size:clamp(29px,5vw,44px);color:var(--deep);margin:11px 0}.finish p{font-size:23px}.finish button{margin-top:10px}.hidden{display:none!important}.footer{text-align:center;color:#748071;font-size:13px;margin:15px 0 0}@keyframes nudge{0%,100%{transform:translateX(0)}35%{transform:translateX(-5px)}70%{transform:translateX(5px)}}@media(max-width:620px){.wrap{width:calc(100% - 18px);padding-top:14px}.hero{padding-bottom:12px}.tabs{gap:6px}.tab{padding:11px 5px;border-radius:14px}.tab small{font-size:10px}.panel{padding:16px 11px 19px;border-radius:22px}.portrait-stage{height:265px}.portrait-stage.trio{height:235px}.sentence{min-height:68px;gap:5px}.choices{gap:8px}.choice{min-width:calc(50% - 8px);padding:9px 10px;min-height:49px}.bottom{margin-top:8px}.score,.badge{font-size:12px}}@media(max-height:750px) and (min-width:621px){.wrap{padding-top:12px}.hero{padding-bottom:12px}.portrait-stage{height:250px}.instruction{margin-top:12px}.panel{padding-top:17px;padding-bottom:17px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.tab{font-size:clamp(13px,1.6vw,17px);padding-left:7px;padding-right:7px}.question-aux{font-weight:1000;color:#1d6948;padding:1px 8px;border-radius:9px;background:#edf3df}.answer-input{width:min(380px,100%);min-height:56px;border:2px solid #dce4d1;border-radius:17px;background:#fff;padding:11px 16px;color:var(--deep);font:800 clamp(18px,2.6vw,23px) var(--ui);outline:none}.answer-input:focus{border-color:#82a475}.answer-input.correct{border-color:#71a878;background:#edf7ea;color:#286a37}.answer-input.wrong{border-color:#dfa0a1;background:#fff4f1}.check-answer{min-height:56px;border:0;border-radius:17px;background:var(--green);color:#fff;padding:0 20px;font:800 18px var(--ui);cursor:pointer}.check-answer:disabled{opacity:.55;cursor:default}@media(max-width:700px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.tab{font-size:15px}.answer-input{width:100%}.check-answer{width:100%}}

function questionMarkup(question){const match=question.match(/^(Is|Are|Has|Have)\b\s*(.*)$/);return match?`<strong class="question-aux">${safe(match[1])}</strong> <span>${safe(match[2])}</span>`:safe(question)}
function begin(mode){state.mode=mode;state.items=shuffled(mode==='writing'?DATA.questions:DATA[mode]);state.index=0;state.points=0;state.answered=false;document.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-selected',String(tab.dataset.mode===mode)));byId('exercise').classList.remove('hidden');byId('finish').classList.add('hidden');render()}
function render(){const item=state.items[state.index];state.answered=state.mode==='writing';state.firstTry=true;byId('counter').textContent=`Карточка ${state.index+1} из ${state.items.length}`;byId('score').textContent=state.mode==='writing'?'✦ Устная практика':`✦ ${state.points} / ${state.items.length}`;byId('progress').style.width=`${state.index/state.items.length*100}%`;byId('instruction').textContent=META[state.mode];byId('portraits').classList.toggle('trio',item.elves.length===3);byId('portraits').innerHTML=item.elves.map(name=>`<figure class="elf" style="margin:0"><img src="${DATA.portraits[name]}" alt="${safe(name)}"><figcaption class="elf-name">${safe(name)}</figcaption></figure>`).join('');let options=[];if(state.mode==='vocabulary'){byId('sentence').innerHTML=`<span>${safe(item.before)}</span> <span class="blank" id="blank">_____</span><span>${safe(item.after)}</span>`;options=item.choices}else if(state.mode==='verbs'){byId('sentence').innerHTML=`<span>${safe(item.subject)}</span> <span class="blank" id="blank">_____</span> <span>${safe(item.tail)}</span>`;options=['is','are','have got','has got']}else{byId('sentence').innerHTML=questionMarkup(item.question);if(state.mode==='questions')options=item.choices}byId('choices').innerHTML='';shuffled(options).forEach(option=>{const button=document.createElement('button');button.className='choice';button.type='button';button.textContent=option;button.addEventListener('click',()=>answer(button,option));byId('choices').appendChild(button)});byId('feedback').textContent='';byId('feedback').className='feedback';byId('next').disabled=state.mode!=='writing';byId('next').textContent=state.index===state.items.length-1?(state.mode==='writing'?'Завершить ✦':'Результат ✦'):'Далее →'}
function answer(control,value){if(state.answered)return;const item=state.items[state.index];const correct=state.mode==='writing'?normalize(value)===normalize(item.answer):value===item.answer;if(correct){state.answered=true;if(state.firstTry)state.points++;control.classList.remove('wrong');control.classList.add('correct');control.disabled=true;document.querySelectorAll('.choice').forEach(choice=>choice.disabled=true);const check=document.querySelector('.check-answer');if(check)check.disabled=true;const blank=byId('blank');if(blank){blank.textContent=item.answer;blank.classList.add('solved')}magicSound(true);byId('feedback').className='feedback';byId('feedback').textContent=state.firstTry?'Wonderful! ✨':'Correct! ✨';byId('score').textContent=`✦ ${state.points} / ${state.items.length}`;byId('progress').style.width=`${(state.index+1)/state.items.length*100}%`;byId('next').disabled=false;byId('next').focus()}else{state.firstTry=false;control.classList.add('wrong');if(state.mode!=='writing')control.disabled=true;magicSound(false);byId('feedback').className='feedback retry';byId('feedback').textContent='Try again! Подумай ещё раз.';if(state.mode==='writing')control.focus()}}
function complete(){byId('exercise').classList.add('hidden');if(state.mode==='writing'){byId('finish').innerHTML=`<div class="finish-icon">✨</div><h2>Speaking practice complete!</h2><p>Ты ответил на ${state.items.length} вопросов.</p><button class="next" type="button" id="again">Пройти ещё раз ↻</button>`}else{const percent=Math.round(state.points/state.items.length*100);const heading=percent===100?'Perfect magic!':percent>=70?'Wonderful work!':'Keep practising!';byId('finish').innerHTML=`<div class="finish-icon">${percent>=70?'🏆':'🍀'}</div><h2>${heading}</h2><p>Правильно с первой попытки: <strong>${state.points} из ${state.items.length}</strong></p><p>${percent}% ✦</p><button class="next" type="button" id="again">Пройти ещё раз ↻</button>`}byId('finish').classList.remove('hidden');byId('again').addEventListener('click',()=>begin(state.mode))}
byId('next').addEventListener('click',()=>{if(!state.answered)return;if(state.index===state.items.length-1)complete();else{state.index++;render()}});byId('restart').addEventListener('click',()=>begin(state.mode));document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>begin(tab.dataset.mode)));document.addEventListener('keydown',event=>{if(event.key==='Enter'&&state.answered&&!byId('exercise').classList.contains('hidden'))byId('next').click()});begin('vocabulary');
</script>
</body>
</html>
